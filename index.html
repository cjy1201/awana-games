<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AWANA 게임</title>
<meta name="description" content="AWANA Korea 게임 시간에 태블릿으로 함께 하는 게임 모음">
<meta name="theme-color" content="#16224A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWANA 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/jua.woff" as="font" type="font/woff" crossorigin>
<style>
  @font-face {
    font-family: "Jua";
    src: url("fonts/jua.woff") format("woff");
    font-display: block;
  }
  /* 체육관 코트 한 가지 세계로 고정한 단일 테마 */
  :root {
    --navy: #16224A;
    --navy-2: #22315C;
    --navy-3: #2C3D6E;
    --floor: #EEF2F7;
    --ink: #16224A;
    --muted: #5A6689;
    --paper: #FFFFFF;
    --red: #E8403A;
    --blue: #2F6FE4;
    --green: #1FA35A;
    --yellow: #F5C21B;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html { background: var(--navy); }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -20%, var(--navy-3) 0, transparent 60%),
      var(--navy);
    color: var(--paper);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: pan-y;   /* 위아래로만 넘겨요: 확대 막기 */
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 32px);
    display: grid;
    gap: 24px;
  }

  /* 머리글: 네 팀 색 띠가 코트 테두리처럼 */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: grid; gap: 6px; }
  .stripes { display: flex; gap: 6px; }
  .stripes i { display: block; width: 44px; height: 8px; border-radius: 4px; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1;
    margin: 6px 0 0;
    letter-spacing: -0.01em;
  }
  .tagline { margin: 0; color: #B9C3DD; font-size: 16px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter {
    font-family: var(--display);
    font-size: 18px;
    border: 2px solid var(--navy-3);
    background: transparent;
    color: #DCE3F2;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .filter[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .filter:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* 게임 카드 */
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    overflow: hidden;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: transform .12s ease-out, box-shadow .12s ease-out;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,.32); }
  a.card:active { transform: translateY(1px) scale(.99); }
  a.card:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .card.soon { background: #DCE2EE; box-shadow: none; }
  .thumb {
    aspect-ratio: 16 / 10;
    max-width: 100%;
    background: var(--floor);
    display: grid;
    place-items: center;
    border-bottom: 6px solid var(--team, var(--navy));
  }
  .card.soon .thumb { background: #E7EBF3; filter: grayscale(.55); opacity: .75; }
  .thumb svg { width: 72%; height: 82%; }
  .body { display: grid; gap: 8px; padding: 16px 18px 18px; align-content: start; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
    border-radius: 999px;
    padding: 3px 10px;
    background: var(--floor);
    color: var(--muted);
  }
  .tag.club { background: var(--navy); color: #fff; }
  .card h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 25px;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    word-break: keep-all;
  }
  .card p { margin: 0; font-size: 14.5px; line-height: 1.5; color: #3C4A70; word-break: keep-all; }
  .card.soon p { color: var(--muted); }
  .play {
    margin-top: 6px;
    justify-self: start;
    font-family: var(--display);
    font-size: 20px;
    background: var(--navy);
    color: #fff;
    border-radius: 999px;
    padding: 9px 22px;
    box-shadow: 0 4px 0 #0A1230;
  }
  .soon-pill {
    margin-top: 6px;
    justify-self: start;
    font-family: var(--display);
    font-size: 17px;
    color: var(--muted);
    border: 2px dashed #A9B3CB;
    border-radius: 999px;
    padding: 6px 16px;
  }

  /* 설치 안내 */
  .install {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    background: var(--navy-2);
    border-radius: 18px;
    padding: 14px 18px;
    color: #DCE3F2;
    font-size: 15px;
    line-height: 1.5;
  }
  .install b { font-family: var(--display); font-weight: 400; font-size: 19px; color: #fff; }
  .install kbd {
    font-family: var(--body);
    font-weight: 700;
    background: var(--navy-3);
    color: #fff;
    border-radius: 6px;
    padding: 1px 7px;
  }
  footer { color: #8C98B8; font-size: 13px; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">
      <div class="stripes" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--blue)"></i><i style="background:var(--green)"></i><i style="background:var(--yellow)"></i></div>
      <h1>AWANA 게임</h1>
      <p class="tagline">게임 시간에 태블릿 하나로, 네 팀이 둘러앉아 함께 해요</p>
    </div>
    <div class="filters" role="group" aria-label="클럽별로 보기">
      <button class="filter" type="button" data-club="all" aria-pressed="true">전체</button>
      <button class="filter" type="button" data-club="Sparks" aria-pressed="false">Sparks</button>
      <button class="filter" type="button" data-club="T&amp;T" aria-pressed="false">T&amp;T</button>
    </div>
  </header>

  <section class="games" id="games" aria-label="게임 목록"></section>

  <div class="install" id="install">
    <b>앱처럼 설치하기</b>
    <span>iPad: Safari <kbd>공유</kbd> → <kbd>홈 화면에 추가</kbd> · Android: Chrome <kbd>⋮</kbd> → <kbd>앱 설치</kbd> · 설치하면 브라우저 탭이 없어서 잘못 눌러 다른 곳으로 가지 않아요 · 브라우저에서도 게임을 시작하면 전체 화면으로 바뀌어요</span>
  </div>

  <footer>AWANA Korea 게임 시간 규칙을 바탕으로 만들었어요 · 정식 게임 트랙 12m × 12m</footer>
</main>

<script>
(() => {
  // 태블릿에서 확대되지 않게 (iPad Safari 는 user-scalable=no 를 무시해요)
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, stop, { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });

  // 게임 목록. 새 게임을 만들면 ready: true 와 href 를 채워요.
  const GAMES = [
    {
      id: 'relay', ready: true, href: 'relay/',
      club: 'Sparks', title: 'Sparks 단거리 이어달리기',
      desc: '배턴 존에서 배턴 터치! 마지막 주자는 우리 팀 핀을 돌아 가운데 종료 핀까지.',
      tags: ['4팀', '2개 조', '1등 400점'], team: 'var(--red)', art: 'relay',
    },
    {
      id: 'safari', ready: true, href: 'safari/',
      club: 'Sparks', title: 'Sparks 사파리',
      desc: '콩주머니를 머리에 얹고 한 바퀴! 떨어뜨리면 멈춰서 다시 얹고, 코치가 다음 친구에게 옮겨줘요.',
      tags: ['4팀', '2개 조 · 3명', '1등 400점'], team: 'var(--green)', art: 'safari',
    },
    {
      id: 'ball-relay', ready: true, href: 'ballrelay/',
      club: 'Sparks', title: 'Sparks 볼 릴레이',
      desc: '대각선에 한 줄로 서서 공을 다리 사이로! 공이 손에 닿을 때 톡, 마지막 친구는 핀까지 달려요.',
      tags: ['4팀', '11명', '2번 진행'], team: 'var(--blue)', art: 'ball',
    },
    {
      id: 'bowling', ready: true, href: 'bowling/',
      club: 'Sparks', title: 'Sparks 볼링',
      desc: '한 바퀴 돌고 콩주머니로 중앙 핀을! 꾹 눌렀다가 초록에서 떼면 맞아요.',
      tags: ['4팀', '4개 조 개인전', '1등 100점'], team: 'var(--green)', art: 'bowling',
    },
    {
      id: 'inout', ready: true, href: 'inout/',
      club: 'Sparks', title: 'Sparks 콩주머니 인앤아웃',
      desc: '콩주머니를 들고 들어가 가운데 것과 바꿔 와요. 선에 닿지 않게 초록 칸에서 톡!',
      tags: ['4팀', '10명 전원', '2번 진행'], team: 'var(--red)', art: 'beanbag',
    },
    {
      id: 'tug', club: 'Sparks', title: '사방 줄다리기',
      desc: '네 팀이 네 방향에서 동시에 겨뤄요.',
      tags: ['4팀'], team: 'var(--yellow)', art: 'tug',
    },
    {
      id: 'basketball', club: 'T&T', title: 'T&T 농구',
      desc: '정해진 구역 안에서 농구공을 넣어요.',
      tags: ['4팀'], team: 'var(--blue)', art: 'basket',
    },
  ];

  // 카드 그림 (코트 바닥 위에 그린 픽토그램)
  const PIN = (x, y, s = 1, c = '#E8403A') => `
    <g transform="translate(${x} ${y}) scale(${s})">
      <path d="M0 -24 m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 M-3 -18 h6 l3 10 q4 8 1 16 h-14 q-3 -8 1 -16 z" fill="#fff" stroke="#16224A" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-3.5 -14 h7" stroke="${c}" stroke-width="3"/>
    </g>`;
  const RUNNER = (x, y, c) => `<circle cx="${x}" cy="${y}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/>`;
  const ART = {
    relay: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <rect x="37" y="5" width="126" height="115" rx="6" fill="#fff" stroke="#16224A" stroke-width="2"/>
      <rect x="37" y="5" width="126" height="7" fill="#E8403A"/><rect x="156" y="5" width="7" height="115" fill="#2F6FE4"/>
      <rect x="37" y="113" width="126" height="7" fill="#1FA35A"/><rect x="37" y="5" width="7" height="115" fill="#F5C21B"/>
      <g stroke-width="3" stroke-linecap="round">
        <path d="M44 12 L92 55" stroke="#E8403A"/><path d="M156 12 L108 55" stroke="#2F6FE4"/>
        <path d="M156 113 L108 70" stroke="#1FA35A"/><path d="M44 113 L92 70" stroke="#F5C21B"/>
      </g>
      <circle cx="100" cy="62.5" r="36" fill="none" stroke="#16224A" stroke-width="4"/>
      <rect x="90" y="52.5" width="20" height="20" fill="#fff" stroke="#16224A" stroke-width="1.5"/>
      ${RUNNER(62, 36, '#E8403A')}${RUNNER(140, 50, '#2F6FE4')}${RUNNER(128, 96, '#1FA35A')}${RUNNER(66, 94, '#F5C21B')}
      ${PIN(100, 72, .55)}
    </svg>`,
    safari: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <path d="M20 112 Q100 60 180 112" stroke="#16224A" stroke-width="3" fill="none"/>
      <rect x="126" y="70" width="30" height="30" fill="#fff" stroke="#16224A" stroke-width="2"/>
      <circle cx="141" cy="85" r="11" fill="#16224A" stroke="#1FA35A" stroke-width="3"/>
      <circle cx="70" cy="74" r="16" fill="#1FA35A" stroke="#fff" stroke-width="4"/>
      <rect x="52" y="38" width="36" height="18" rx="7" fill="#1FA35A" stroke="#16224A" stroke-width="3" transform="rotate(-10 70 47)"/>
      <path d="M40 40 q-8 6 0 12 M100 36 q8 6 0 12" stroke="#E8403A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M58 90 l-8 16 M82 90 l8 16" stroke="#16224A" stroke-width="5" stroke-linecap="round"/>
    </svg>`,
    ball: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <path d="M30 110 L170 20" stroke="#2F6FE4" stroke-width="4" stroke-linecap="round"/>
      ${[0, 1, 2, 3, 4].map(i => RUNNER(46 + i * 26, 100 - i * 17, '#2F6FE4')).join('')}
      <circle cx="98" cy="38" r="15" fill="#F5C21B" stroke="#16224A" stroke-width="2.5"/>
      <path d="M84 36 q14 8 28 0 M98 23 v30" stroke="#16224A" stroke-width="2" fill="none"/>
      <path d="M70 44 q10 -22 26 -24" stroke="#16224A" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>
    </svg>`,
    bowling: `<svg viewBox="0 0 200 125" aria-hidden="true">
      ${PIN(128, 64, 1, '#1FA35A')}${PIN(148, 70, 1, '#1FA35A')}${PIN(168, 64, 1, '#1FA35A')}${PIN(138, 94, 1, '#1FA35A')}${PIN(158, 98, 1, '#1FA35A')}
      <rect x="36" y="74" width="30" height="22" rx="7" fill="#1FA35A" stroke="#16224A" stroke-width="2.5"/>
      <path d="M72 82 h36" stroke="#16224A" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
    </svg>`,
    tug: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <path d="M100 18 V107 M40 62.5 H160" stroke="#8A6A3A" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="62.5" r="8" fill="#16224A"/>
      ${RUNNER(100, 14, '#E8403A')}${RUNNER(164, 62.5, '#2F6FE4')}${RUNNER(100, 111, '#1FA35A')}${RUNNER(36, 62.5, '#F5C21B')}
    </svg>`,
    beanbag: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <rect x="30" y="80" width="32" height="24" rx="8" fill="#E8403A" stroke="#16224A" stroke-width="2.5"/>
      <rect x="84" y="50" width="32" height="24" rx="8" fill="#F5C21B" stroke="#16224A" stroke-width="2.5"/>
      <rect x="138" y="22" width="32" height="24" rx="8" fill="#2F6FE4" stroke="#16224A" stroke-width="2.5"/>
      <path d="M66 86 q16 -20 14 -24 M120 56 q16 -20 14 -24" stroke="#16224A" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>
    </svg>`,
    basket: `<svg viewBox="0 0 200 125" aria-hidden="true">
      <rect x="118" y="14" width="52" height="36" rx="3" fill="#fff" stroke="#16224A" stroke-width="2.5"/>
      <path d="M130 50 h28 l-4 22 h-20 z" fill="none" stroke="#E8403A" stroke-width="3"/>
      <path d="M134 56 l20 12 M154 56 l-20 12" stroke="#E8403A" stroke-width="1.5"/>
      <circle cx="62" cy="80" r="20" fill="#E8792E" stroke="#16224A" stroke-width="2.5"/>
      <path d="M42 80 h40 M62 60 v40 M48 66 q14 14 0 28 M76 66 q-14 14 0 28" stroke="#16224A" stroke-width="2" fill="none"/>
      <path d="M84 62 q30 -40 60 -16" stroke="#16224A" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>
    </svg>`,
  };

  const list = document.getElementById('games');
  function render(club) {
    list.innerHTML = GAMES.filter(g => club === 'all' || g.club === club).map(g => {
      const tags = `<div class="tags"><span class="tag club">${g.club}</span>${(g.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
      const inner = `
        <div class="thumb" style="--team:${g.team}">${ART[g.art] || ''}</div>
        <div class="body">
          ${tags}
          <h2>${g.title}</h2>
          <p>${g.desc}</p>
          ${g.ready ? '<span class="play">시작하기 →</span>' : '<span class="soon-pill">준비 중</span>'}
        </div>`;
      return g.ready
        ? `<a class="card" href="${g.href}">${inner}</a>`
        : `<div class="card soon" aria-disabled="true">${inner}</div>`;
    }).join('');
  }
  document.querySelectorAll('.filter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.setAttribute('aria-pressed', x === b));
    render(b.dataset.club);
  }));
  render('all');

  // 이미 홈 화면 앱으로 열었으면 설치 안내 숨기기
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
  if (standalone) document.getElementById('install').hidden = true;

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
})();
</script>
</body>
</html>
